{% extends "base.html" %}
{% block content %}
<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #2c5e1a;
        }
        h2 {
            color: #2c5e1a;
        }

        .language.button {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background-color: #2c5e1a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .language.button:hover {
            background-color: #1d4b0f;
        }
    </style>
    <title>Results</title>
    
</head>

<body>


<h1>Quiz Complete!</h1>


<h2>
Final Score: {{score}}/{{total}}
</h2>


{% if score == total %}

<p>🎉 Perfect Score!</p>

{% elif score >= 7 %}

<p>Excellent work!</p>

{% else %}

<p>Keep learning!</p>

{% endif %}


<a href="/">
Return Home
</a>


</body>

</html>
{% endblock %}
